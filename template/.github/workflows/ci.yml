# Build the firmware and run the host tests (the update path, the store, the app, the installer, the emulator) on
# every push and pull request. The JieLi toolchain and SDK files are cached: their servers (JieLi, Gitee) are slow
# and reset connections now and then; a failure in "Set up" is the network, re-run it.
name: build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5           # (a Python whose pip may install: Pillow, fontTools)
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache the JieLi toolchain, the SDK files and Emscripten
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
            ~/emsdk
          key: fm1-tools-v1-${{ hashFiles('.claude/skills/fm1-platform/scripts/setup_env.sh', 'tools/get_toolchain.sh') }}

      - name: Set up
        run: sh .claude/skills/fm1-platform/scripts/setup_env.sh --emsdk

      - name: Build
        run: ./build.sh

      - name: Host tests
        run: |
          . ~/emsdk/emsdk_env.sh
          tests/run_tests.sh 2>&1 | tee build/tests.log
          tail -1 build/tests.log | grep -q "ALL HOST TESTS PASSED"

      - name: Keep the package, the screens and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/firmware.fwsc
            build/shots/
            build/tests.log
          if-no-files-found: ignore
